[tool.poetry]
name = "scrum-master-agent"
version = "0.1.0"
description = "Scrum Master Digital Worker — Sprint Status Agent using LangGraph + MCP + Jira"
authors = ["Scrum Master Agent"]
readme = "README.md"
packages = [{include = "scrum_master_agent"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain = "^0.3"
langchain-anthropic = "^0.3"
langchain-mcp-adapters = "^0.1"
mcp = "^1.0"
atlassian-python-api = "^3.41"
pydantic = "^2.0"
pydantic-settings = "^2.0"
apscheduler = "^3.10"
slack-sdk = "^3.27"
python-dotenv = "^1.0"
httpx = "^0.27"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
respx = "^0.21"
ruff = "^0.4"

[tool.poetry.scripts]
sprint-status = "scrum_master_agent.workflows.sprint_status_workflow:cli"
weekly-recap = "scrum_master_agent.workflows.weekly_recap_workflow:cli"
mcp-server = "scrum_master_agent.mcp_server.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
